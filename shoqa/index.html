
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شقه مکتب - سیستم نمرات افغانستان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #f0f2f5;
            color: black;
            margin: 0;
            padding: 0;
            -webkit-print-color-adjust: exact;
        }
        [contenteditable]:focus {
            outline: 2px solid #6366f1;
            background: #f5f3ff;
            border-radius: 2px;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        @media print {
            .no-print, .control-panel, button, input, .no-print-hover {
                display: none !important;
                visibility: hidden !important;
            }
            body {
                background-color: white !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            @page {
                size: A4 landscape;
                margin: 0mm !important; /* حاشیه صفر مطلق */
            }
            .page-wrapper {
                width: 297mm !important;
                height: 210mm !important;
                display: flex !important;
                flex-direction: row !important;
                justify-content: center !important;
                align-items: flex-start !important;
                gap: 0 !important;
                padding: 0 !important;
                margin: 0 !important;
                page-break-after: always;
                box-sizing: border-box;
            }
            .a4-container {
                box-shadow: none !important;
                margin: 0 !important;
                width: 148.5mm !important; /* دقیقاً نصف A4 */
                height: 210mm !important;
                padding: 2mm !important;
                border: 0.2mm solid #000 !important;
                flex-shrink: 0;
                overflow: hidden;
                box-sizing: border-box;
                page-break-inside: avoid;
            }
            table {
                border-width: 1.5pt !important;
            }
            th, td {
                font-size: 6.8pt !important;
                padding: 0.1mm 0.2mm !important;
                height: 3.75mm !important; /* ارتفاع دقیق برای جا شدن ۴۰ سطر در فضای باقی‌مانده */
                border: 0.1mm solid #000 !important;
            }
            .rotated-text {
                height: 42px !important;
                width: 30px !important;
                font-size: 6pt !important;
            }
            .header-area {
                padding-bottom: 1mm !important;
            }
        }

        .page-wrapper {
            display: flex;
            justify-content: center;
            padding: 20px;
            gap: 10px;
        }
        .a4-container {
            width: 148.5mm;
            height: 210mm;
            padding: 4mm;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
            color: black;
            display: flex;
            flex-direction: column;
            border: 1px solid #000;
            box-sizing: border-box;
            overflow: hidden;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            border: 1.5px solid black;
        }
        th, td {
            border: 1px solid black;
            text-align: center;
            font-size: 7.2pt;
            padding: 1px 2px;
            color: black;
            vertical-align: middle;
            white-space: nowrap;
            height: 4mm;
        }
        .rotated-text {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            white-space: nowrap;
            height: 50px;
            width: 32px;
            font-size: 6.5pt;
        }
        .identity-cell {
            text-align: center;
            min-width: 45px;
        }
        .basis-cell {
            width: 28px !important;
            font-size: 6.5pt;
        }
        .row-input-wrapper {
            display: flex;
            align-items: center;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 2px 8px;
        }
    </style>
